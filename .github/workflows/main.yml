name: Deploy Rustee Metadata Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rustee-metadata-installer-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The 404 this package exists to prevent: Pages serves the repo root,
      # and the root URL only resolves if index.html is present at the top
      # level. A file named Rustee_Metadata_Installer_v1.html is reachable
      # only at its exact path.
      - name: Verify Pages entry point
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f .nojekyll
          echo "PASS: index.html and .nojekyll present at repo root"

      - name: Verify installer integrity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "0x4523467C4DDC6D775C7EaD4Dce7656DCe54e7F60" index.html
          grep -q "SEL_SET_TOKEN_URI='e0df5b6f'" index.html
          grep -q "SEL_METADATA_FROZEN='fb3cc6c2'" index.html
          grep -q 'id="TOKEN_URI"' index.html
          echo "PASS: contract address and selectors intact"

      - name: Verify embedded tokenURI matches assets/tokenURI_utf8.txt
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re, sys, pathlib
          html = pathlib.Path("index.html").read_text()
          m = re.search(r'id="TOKEN_URI" type="text/plain">(.*?)</script>', html, re.S)
          if not m:
              sys.exit("FAIL: TOKEN_URI script block not found")
          embedded = m.group(1)
          source = pathlib.Path("assets/tokenURI_utf8.txt").read_text()
          if embedded != source:
              sys.exit(f"FAIL: embedded tokenURI ({len(embedded)} chars) "
                       f"differs from assets/tokenURI_utf8.txt ({len(source)} chars)")
          if not embedded.startswith("data:application/json"):
              sys.exit("FAIL: embedded tokenURI is not a data URI")
          print(f"PASS: embedded tokenURI matches source, {len(embedded)} chars")
          PY

      # Match assignment patterns and raw key material only. An earlier version
      # matched the words "seed phrase", which fired on the installer's own
      # copy stating that a seed phrase is never requested — the same self-scan
      # false positive that failed v4.9.3.2 in the Rustee workflow lineage.
      - name: Verify no secrets present
        shell: bash
        run: |
          set -euo pipefail
          if grep -rniE "(private[_-]?key|mnemonic|secret)[\"' ]*[:=][\"' ]*[^\"' ]|0x[0-9a-fA-F]{64}\b" \
             index.html tools/ 2>/dev/null; then
            echo "FAIL: possible secret material found"
            exit 1
          fi
          echo "PASS: no key material detected"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
